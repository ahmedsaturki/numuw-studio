# Display-only. The metric is measured over all 52 tracked HTML pages; this field
# is not used to scope the run (run_experiment.py reads it only to print it).
target: all pages (**/*.html, sitemap.xml, assets/**)
evaluate_cmd: bash autoresearch.sh
metric: issues * 1e6 + html_bytes
metric_direction: lower
metric_grep: ^METRIC issues * 1e6 + html_bytes=
time_budget_minutes: 5
created: 2026-10-04 12:12

# metric_grep is a literal prefix match, not a regex: run_experiment.py strips a
# leading `^` and a trailing `=`, then requires line.strip().startswith(prefix).
# No backslash escapes - write the characters themselves.
# Baseline at commit 6b2344a: issues=0, html_bytes=335458, combined=335458.
