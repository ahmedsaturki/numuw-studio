name: NUMUW Static Audit

on:
  push:
    branches:
      - main
      - "numuw-*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: numuw-static-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run static audit
        run: node scripts/numuw-static-audit.mjs
      - name: Run scanner rule regression suite
        run: node bench/test-site-quality.mjs
      - name: Enforce benchmark quality floor
        shell: bash
        run: |
          set -o pipefail
          node bench/site-quality.mjs 2>&1 | tee /tmp/numuw-site-quality.log
          grep -q '^METRIC issues=0$' /tmp/numuw-site-quality.log
