name: NUMUW Static Audit

on:
  push:
    branches:
      - main
      - "numuw-*"
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run static audit
        run: node scripts/numuw-static-audit.mjs
